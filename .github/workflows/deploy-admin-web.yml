name: Deploy web apps

# Builds both web front-ends and publishes them to GitHub Pages
# alongside the APK download page.
#
# The site ends up as:
#   https://attendx-eee.github.io/attendx/         -> download page (docs/)
#   https://attendx-eee.github.io/attendx/admin/   -> staff console
#   https://attendx-eee.github.io/attendx/app/     -> student web app (iPhone)
#
# `lib/main.dart` is never built here. It pulls in TFLite, ML Kit, the
# camera and `dart:io` for face enrollment, none of which compile for
# the web. The two web entry points reach only screens that are plain
# Flutter + Firestore, which is what makes a browser build possible
# without forking the app.

on:
  push:
    branches: [main]
    # Skip the build when a push touched nothing the console is made of.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'docs/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-admin-web.yml'
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Pages needs these; `contents: read` alone will fail the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Doesn't block the deploy — the mobile-only sources (camera, face
        # enrollment) legitimately raise web-irrelevant hints in this job.
        run: flutter analyze --no-fatal-infos || true

      - name: Build admin console
        # base-href must match the repo subpath, with both slashes, or
        # every asset 404s once it's served from /attendx/admin/.
        run: |
          flutter build web \
            --release \
            -t lib/main_web.dart \
            --base-href /attendx/admin/
          mv build/web build/admin-web

      - name: Build student web app
        # The iPhone answer. Same repo, different entry point: the mobile
        # root reaches the camera, TFLite and dart:io through
        # registration, none of which compile for the web.
        run: |
          flutter build web \
            --release \
            -t lib/main_student_web.dart \
            --base-href /attendx/app/

          # Both builds share web/index.html, which is titled for the
          # console. Retitle the student copy — the title is what iOS
          # uses as the Home Screen label when a student adds it.
          sed -i 's/AttendX Admin/AttendX/g' build/web/index.html
          sed -i 's/AttendX Admin/AttendX/g' build/web/manifest.json

          mv build/web build/student-web

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The download page stays at the root.
          cp -r docs/. _site/
          # Console and student app each get their own folder underneath.
          mkdir -p _site/admin _site/app
          cp -r build/admin-web/. _site/admin/
          cp -r build/student-web/. _site/app/
          # Pages runs Jekyll by default, which strips files and folders
          # beginning with an underscore — Flutter emits some.
          touch _site/.nojekyll

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
